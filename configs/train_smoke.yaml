# A few minutes on a CPU: checks the whole chain, learns little.
output: ../runs/smoke
data:
  bank: ../data/dev/bank.h5
  validation: ../data/dev/validation.h5
  grid: [128, 128]
  batch_size: 16
  workers: 6
  prefetch_factor: 2
network:
  widths: [16, 32, 64, 128]
  attention_layers: 1
  attention_heads: 4
optim:
  steps: 150
  warmup_steps: 20
runtime:
  device: cpu
  log_every: 10
  validate_every: 75
  checkpoint_every: 75
